name: L1-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true


env:
  BUILD_TYPE: Debug
  REPO_NAME: "audiooutput"
  THUNDER_TOOLS_COMMIT_SHA: "d5dd83c7c19c49c7f25c558c126500bd2d64f7a4"
  THUNDER_COMMIT_SHA: "2c0fcc5529e7da734be558ca6efa05d934dcce31"
  INTERFACES_REF: "develop"
  TESTFRAMEWORK_REF: "feature/RDKEMW-20294"
  RDK_SERVICES_L1_TEST: "ON"
  ENABLE_CACHE: "false"

jobs:
  L1-tests:
    name: Build and run L1 unit tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
          echo "Message: External Trigger Received for L1 Tests"
          echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.16.x'

      # audiooutput only needs DS HAL, no sqlite/websocket/grpc/boost
      # libcunit1/libcunit1-dev: trower-base64 meson build
      # libcurl4-openssl-dev: entservices-helpers utils.cpp includes curl/curl.h
      # libdrm-dev: devicesettings.h -> xf86drmMode.h -> drm.h
      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y
          valgrind
          lcov
          clang
          libsystemd-dev
          libunwind-dev
          meson
          curl
          libcunit1
          libcunit1-dev
          libcurl4-openssl-dev
          libdrm-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev

      - name: Build trower-base64
        run: |
          if [ ! -d "trower-base64" ]; then
            git clone https://github.com/xmidt-org/trower-base64.git
          fi
          cd trower-base64
          meson setup --warnlevel 3 --werror build
          ninja -C build
          sudo ninja -C build install

      # ---- Checkouts -------------------------------------------------------

      - name: Checkout Thunder
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{ env.THUNDER_COMMIT_SHA }}

      - name: Checkout ThunderTools
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{ env.THUNDER_TOOLS_COMMIT_SHA }}

      - name: Checkout entservices-testframework
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: ${{ env.TESTFRAMEWORK_REF }}

      # Checkout the plugin repo itself
      - name: Checkout entservices-audiooutput
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v3
        with:
          path: entservices-audiooutput

      - name: Checkout entservices-audiooutput (from testframework trigger)
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-audiooutput
          path: entservices-audiooutput
          ref: feature/RDKEMW-20294_2

      - name: Checkout googletest
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Checkout entservices-apis
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{ env.INTERFACES_REF }}

      - name: Checkout entservices-helpers
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-helpers
          path: entservices-helpers
          ref: develop

      # ---- Patches ---------------------------------------------------------

      - name: Apply patches entservices-apis
        run: |
          cd $GITHUB_WORKSPACE/entservices-apis
          rm -rf $GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-1007.patch
          cd -

      # ---- Builds ----------------------------------------------------------

      - name: Build ThunderTools
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Build Thunder
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBINDING=127.0.0.1
          -DPORT=55555
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Build entservices-apis
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      # Generate empty stub headers for DS HAL types and IARMBus.
      # Only the headers actually needed by AudioOutputImplementation.cpp
      # (no systemservices-specific headers like proc/readproc.h, btmgr.h, etc.).
      - name: Generate external headers
        run: >
          cd "$GITHUB_WORKSPACE/entservices-testframework/Tests/"
          &&
          mkdir -p
          headers
          headers/rdk/ds
          headers/rdk/iarmbus
          headers/rdk/iarmmgrs-hal
          headers/rdk/halif/deepsleep-manager
          headers/audiocapturemgr
          headers/ccec/drivers
          headers/network
          &&
          cd headers
          &&
          touch
          rdk/ds/host.hpp
          rdk/ds/list.hpp
          rdk/ds/manager.hpp
          rdk/ds/exception.hpp
          rdk/ds/audioOutputPort.hpp
          rdk/ds/audioOutputPortType.hpp
          rdk/ds/audioOutputPortConfig.hpp
          rdk/ds/audioStereoMode.hpp
          rdk/ds/AudioStereoMode.hpp
          rdk/ds/dsAudio.h
          rdk/ds/dsError.h
          rdk/ds/dsMgr.h
          rdk/ds/dsTypes.h
          rdk/ds/dsUtl.h
          rdk/ds/videoOutputPort.hpp
          rdk/ds/videoOutputPortConfig.hpp
          rdk/ds/videoOutputPortType.hpp
          rdk/ds/videoResolution.hpp
          rdk/ds/videoDevice.hpp
          rdk/ds/hdmiIn.hpp
          rdk/ds/compositeIn.hpp
          rdk/ds/sleepMode.hpp
          rdk/ds/pixelResolution.hpp
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          rdk/iarmmgrs-hal/mfrMgr.h
          rdk/iarmmgrs-hal/sysMgr.h
          audiocapturemgr/audiocapturemgr_iarm.h
          ccec/drivers/CecIARMBusMgr.h
          network/wifiSrvMgrIarmIf.h
          network/netsrvmgrIarm.h
          edid-parser.hpp
          libudev.h
          rfcapi.h
          rbus.h
          drm.h
          drm_mode.h
          telemetry_busmessage_sender.h
          maintenanceMGR.h
          pkg.h
          secure_wrapper.h
          wpa_ctrl.h
          &&
          cp -r
          /usr/include/gstreamer-1.0/gst
          /usr/include/glib-2.0/*
          /usr/lib/x86_64-linux-gnu/glib-2.0/include/*
          /usr/local/include/trower-base64/base64.h
          /usr/include/libdrm/drm.h
          /usr/include/libdrm/drm_mode.h
          /usr/include/xf86drm.h
          . &&
          mkdir -p "$GITHUB_WORKSPACE/ci-ds"
          &&
          printf '%s\n'
          'set(DS_FOUND TRUE)'
          "set(DS_INCLUDE_DIRS \"$GITHUB_WORKSPACE/entservices-testframework/Tests/headers\")"
          'set(DS_LIBRARIES "")'
          > "$GITHUB_WORKSPACE/ci-ds/FindDS.cmake"

      # Select toolchain file based on matrix (clang, gcc+coverage, gcc+no-coverage)
      - name: Set clang toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/clang.cmake" >> $GITHUB_ENV

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Build entservices-helpers
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-helpers"
          -B build/entservices-helpers
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DPLUGIN_HELPERS=ON
          "-DCMAKE_CXX_FLAGS=
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h"
          &&
          cmake --build build/entservices-helpers
          &&
          cmake --install build/entservices-helpers

      # Build the mock shared library (TestMocklib) for L1 tests.
      # -DL2_TEST_OOP_RPC=ON selects the MockAccessor/OOP-RPC branch in
      # mocks/CMakeLists.txt, which avoids find_package(Protobuf REQUIRED)
      # (audiooutput does not use SecureStorage/gRPC).
      - name: Build mocks
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DL2_TEST_OOP_RPC=ON
          -DRDK_SERVICES_L1_TEST=ON
          -DUSE_THUNDER_R4=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICES_L1_TEST
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I$GITHUB_WORKSPACE/entservices-helpers/helpers
          -I$GITHUB_WORKSPACE/install/usr/include
          -I$GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/gdialservice.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,syslog
          -DUSE_IARMBUS
          -DHAS_RBUS"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      # Build entservices-audiooutput with L1 test library
      - name: Build entservices-audiooutput
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-audiooutput"
          -B build/entservices-audiooutput
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/ci-ds;$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DUSE_THUNDER_R4=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCOMCAST_CONFIG=OFF
          -DDS_FOUND=ON
          -DPLUGIN_AUDIOOUTPUT=ON
          -DRDK_SERVICES_L1_TEST=ON
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICES_L1_TEST
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/thunder
          -I$GITHUB_WORKSPACE/entservices-helpers/helpers
          -I$GITHUB_WORKSPACE/install/usr/include
          -I./usr/include/libdrm
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/gdialservice.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/HdmiCec.h
          --coverage
          -Wall -Werror -Wno-error=format
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog
          -DENABLE_TELEMETRY_LOGGING
          -DHAS_API_SYSTEM
          -DHAS_RBUS
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4"
          &&
          cmake --build build/entservices-audiooutput -j8
          &&
          cmake --install build/entservices-audiooutput

      # Patch testframework's L1Tests/CMakeLists.txt to link our test library
      # into RdkServicesL1Test. The testframework v1.0.14 has no PLUGIN_AUDIOOUTPUT
      # handler — without this patch, zero tests run and no .gcda files are generated.
      - name: Patch testframework for audiooutput
        run: |
          python3 - <<'PYEOF'
          path = "entservices-testframework/Tests/L1Tests/CMakeLists.txt"
          with open(path, "r") as f:
              content = f.read()
          if "PLUGIN_AUDIOOUTPUT" not in content:
              insert = (
                  "\nif(PLUGIN_AUDIOOUTPUT)\n"
                  "    message(STATUS \"linking libWPEFrameworkL1TestsAudioOutput to RdkServicesL1Test\")\n"
                  "    target_link_libraries(${PROJECT_NAME} \"${ENTSERVICES_REPO_L1TEST_LIB_PATH}/libWPEFrameworkL1TestsAudioOutput.so\")\n"
                  "endif()\n"
              )
              content = content.replace("include(GoogleTest)", insert + "include(GoogleTest)")
              with open(path, "w") as f:
                  f.write(content)
              print("Patched: added PLUGIN_AUDIOOUTPUT handler to testframework CMakeLists.txt")
          else:
              print("Skip: PLUGIN_AUDIOOUTPUT already present")
          PYEOF

      # Build the L1 test runner (RdkServicesL1Test executable)
      - name: Build entservices-testframework
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-testframework"
          -B build/entservices-testframework
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/ci-ds;$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network
          -I$GITHUB_WORKSPACE/entservices-helpers/helpers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests
          -I$GITHUB_WORKSPACE/Thunder/Source
          -I$GITHUB_WORKSPACE/Thunder/Source/core
          -I$GITHUB_WORKSPACE/install/usr/include
          -I$GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -I./usr/include/libdrm
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/gdialservice.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,--no-as-needed
          -DUSE_IARMBUS
          -DHAS_RBUS"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DDS_FOUND=ON
          -DPLUGIN_AUDIOOUTPUT=ON
          -DRDK_SERVICES_L1_TEST=${{ env.RDK_SERVICES_L1_TEST }}
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          &&
          cmake --build build/entservices-testframework -j8
          &&
          cmake --install build/entservices-testframework

      # ---- Run tests -------------------------------------------------------

      - name: Run unit tests without valgrind
        if: ${{ env.RDK_SERVICES_L1_TEST == 'ON' }}
        run: >
          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}" &&
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}" &&
          export GTEST_OUTPUT="json:$(pwd)/rdkL1TestResults.json" &&
          "$GITHUB_WORKSPACE/install/usr/bin/RdkServicesL1Test" &&
          cp -rf $(pwd)/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/rdkL1TestResults.json

      - name: Run unit tests with valgrind
        if: ${{ !env.ACT && env.RDK_SERVICES_L1_TEST == 'ON' && inputs.caller_source != 'testframework' }}
        run: >
          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}" &&
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}" &&
          export GTEST_OUTPUT="json:$(pwd)/rdkL1TestResults.json" &&
          valgrind
          --tool=memcheck
          --log-file=valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          "$GITHUB_WORKSPACE/install/usr/bin/RdkServicesL1Test" &&
          cp -rf $(pwd)/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithValgrind.json &&
          rm -rf $(pwd)/rdkL1TestResults.json

      # ---- Coverage --------------------------------------------------------
      # Coverage is tracked on build/entservices-audiooutput and plugin/ source.
      # Excludes: test headers, mocks, googletest internals, Thunder internals.

      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT && env.RDK_SERVICES_L1_TEST == 'ON' && inputs.caller_source != 'testframework' }}
        run: >
          cp $GITHUB_WORKSPACE/entservices-testframework/Tests/L1Tests/.lcovrc_l1 ~/.lcovrc
          &&
          lcov -c
          -o coverage.info
          -d build/entservices-audiooutput
          -d $GITHUB_WORKSPACE/entservices-audiooutput/plugin
          &&
          lcov
          -r coverage.info
          '/usr/include/*'
          '*/build/entservices-audiooutput/_deps/*'
          '*/install/usr/include/*'
          '*/Tests/headers/*'
          '*/Tests/mocks/*'
          '*/Tests/L1Tests/*'
          '*/Thunder/*'
          -o filtered_coverage.info
          &&
          genhtml
          -o coverage
          -t "entservices-audiooutput L1 coverage"
          filtered_coverage.info

      # ---- Artifacts -------------------------------------------------------

      - name: Upload artifacts
        if: ${{ env.RDK_SERVICES_L1_TEST == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L1-audiooutput
          path: |
            coverage/
            valgrind_log
            rdkL1TestResultsWithoutValgrind.json
            rdkL1TestResultsWithValgrind.json
          if-no-files-found: warn
