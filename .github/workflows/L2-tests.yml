name: L2-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true

# -------------------------------------------------------------------
# What audiooutput L2 needs vs systemservices:
#
# REMOVED (not needed by audiooutput):
#   - entservices-powermanager   (no power management in audiooutput)
#   - entservices-migration      (not related)
#   - entservices-telemetry      (no telemetry plugin)
#   - entservices-deviceinfo     (not related)
#   - entservices-firmwareupdate (not related)
#   - libboost-all-dev, libwebsocketpp-dev (no websocket in audiooutput)
#   - protobuf/grpc packages     (no gRPC in audiooutput)
#   - Extensive /opt, /lib/rdk file setup (systemservices-specific)
#
# KEPT for L2 (vs L1 additions):
#   - libsqlite3-dev, libcurl4-openssl-dev (Thunder runtime needs these)
#   - Thunder port 9998 (test runner connects via COM-RPC on 9998)
#   - Increase_Timout_For_L2Tests_Plugin.patch (critical for L2)
#   - add-l2tests-interface.patch (IL2Test interface for L2TestsPlugin)
#   - Build mocks with -DRDK_SERVICE_L2_TEST=ON
#   - Build L2TestsPlugin + entservices-testframework L2 runner
#   - testframework ref 1.0.17 (L2 version, has MockAccessor + L2TestsMock fixes)
# -------------------------------------------------------------------

env:
  BUILD_TYPE: Debug
  REPO_NAME: "audiooutput"
  THUNDER_TOOLS_COMMIT_SHA: "d5dd83c7c19c49c7f25c558c126500bd2d64f7a4"
  THUNDER_COMMIT_SHA: "2c0fcc5529e7da734be558ca6efa05d934dcce31"
  INTERFACES_REF: "develop"
  TESTFRAMEWORK_REF: "feature/RDKEMW-20294"

jobs:
  L2-tests:
    name: Build and run L2 tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
          echo "Message: External Trigger Received for L2 Tests"
          echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.16.x'

      # L2 adds libsqlite3-dev, libcurl4-openssl-dev for Thunder runtime.
      # libcunit1/libcunit1-dev: trower-base64 meson build
      # libdrm-dev: devicesettings.h -> xf86drmMode.h -> drm.h
      # Intentionally omits: libboost, libwebsocketpp, protobuf, grpc (not needed)
      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y
          valgrind
          lcov
          clang
          libsystemd-dev
          libunwind-dev
          meson
          curl
          libcunit1
          libcunit1-dev
          libsqlite3-dev
          libcurl4-openssl-dev
          libdrm-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          libprotobuf-dev
          protobuf-compiler
          libgrpc++-dev
          protobuf-compiler-grpc

      - name: Build trower-base64
        run: |
          if [ ! -d "trower-base64" ]; then
            git clone https://github.com/xmidt-org/trower-base64.git
          fi
          cd trower-base64
          meson setup --warnlevel 3 --werror build
          ninja -C build
          sudo ninja -C build install

      # ---- Checkouts -------------------------------------------------------

      - name: Checkout Thunder
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{ env.THUNDER_COMMIT_SHA }}

      - name: Checkout ThunderTools
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{ env.THUNDER_TOOLS_COMMIT_SHA }}

      - name: Checkout entservices-testframework
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: ${{ env.TESTFRAMEWORK_REF }}

      - name: Checkout entservices-audiooutput
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v3
        with:
          path: entservices-audiooutput

      - name: Checkout entservices-audiooutput (from testframework trigger)
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-audiooutput
          path: entservices-audiooutput
          ref: feature/RDKEMW-20294_2

      - name: Checkout googletest
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Checkout entservices-apis
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{ env.INTERFACES_REF }}

      - name: Checkout entservices-helpers
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-helpers
          path: entservices-helpers
          ref: develop

      # ---- Patches ---------------------------------------------------------


      - name: Apply patches Thunder
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Increase_Timout_For_L2Tests_Plugin_R4_4-RDK.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/LockFixedBuffer_compat_R4.4.6.patch
          cd -

      - name: Apply patches entservices-apis
        run: |
          cd $GITHUB_WORKSPACE/entservices-apis
          rm -rf $GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-1007.patch
          # L2-specific: adds IL2Test interface used by L2TestsPlugin
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/add-l2tests-interface.patch
          cd -

      # ---- Builds ----------------------------------------------------------

      - name: Build ThunderTools
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      # L2 Thunder: port 9998 (test runner connects via COM-RPC on localhost:9998)
      - name: Build Thunder
        run: |
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/Thunder" \
            -B build/Thunder \
            -DMESSAGING=ON \
            -DPROTOCOLS=ON \
            -DHIDE_NON_EXTERNAL_SYMBOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake" \
            -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBINDING=127.0.0.1 \
            -DPORT=9998 \
            -DEXCEPTIONS_ENABLE=ON

          cmake --build build/Thunder -j8
          cmake --install build/Thunder

          echo "===== THUNDER DEBUG ====="

          echo "--- Thunder HEAD ---"
          git -C "$GITHUB_WORKSPACE/Thunder" rev-parse HEAD

          echo "--- Protocol libraries in build ---"
          find "$GITHUB_WORKSPACE/build/Thunder" \
            \( -name '*Protocols*.so*' -o -name '*Protocols*.a' \) \
            -print || true

          echo "--- Protocol libraries in install ---"
          find "$GITHUB_WORKSPACE/install/usr" \
            \( -name '*Protocols*.so*' -o -name '*Protocols*.a' \) \
            -print || true

          echo "--- All WPEFramework libraries ---"
          find "$GITHUB_WORKSPACE/install/usr/lib" \
            -maxdepth 1 \
            -name 'libWPEFramework*.so*' \
            -printf '%f\n' | sort || true

          echo "--- Protocol references in generated Thunder build ---"
          grep -RIn "WPEFrameworkProtocols\|libWPEFrameworkProtocols" \
            "$GITHUB_WORKSPACE/build/Thunder" 2>/dev/null | head -100 || true
            - name: Build entservices-apis
              run: >
                cmake -G Ninja
                -S "$GITHUB_WORKSPACE/entservices-apis"
                -B build/entservices-apis
                -DEXCEPTIONS_ENABLE=ON
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
                -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
                &&
                cmake --build build/entservices-apis -j8
                &&
                cmake --install build/entservices-apis

      # Generate empty stub headers. Same DS/IARMBus set as L1.
      - name: Generate external headers
        run: >
          cd "$GITHUB_WORKSPACE/entservices-testframework/Tests/"
          &&
          mkdir -p
          headers
          headers/rdk/ds
          headers/rdk/iarmbus
          headers/rdk/iarmmgrs-hal
          headers/audiocapturemgr
          headers/ccec/drivers
          headers/network
          &&
          cd headers
          &&
          touch
          rdk/ds/host.hpp
          rdk/ds/list.hpp
          rdk/ds/manager.hpp
          rdk/ds/exception.hpp
          rdk/ds/audioOutputPort.hpp
          rdk/ds/audioOutputPortType.hpp
          rdk/ds/audioOutputPortConfig.hpp
          rdk/ds/audioStereoMode.hpp
          rdk/ds/AudioStereoMode.hpp
          rdk/ds/VideoDFC.hpp
          rdk/ds/dsAudio.h
          rdk/ds/dsError.h
          rdk/ds/dsMgr.h
          rdk/ds/dsTypes.h
          rdk/ds/dsUtl.h
          rdk/ds/videoOutputPort.hpp
          rdk/ds/videoOutputPortConfig.hpp
          rdk/ds/videoOutputPortType.hpp
          rdk/ds/videoResolution.hpp
          rdk/ds/videoDevice.hpp
          rdk/ds/hdmiIn.hpp
          rdk/ds/compositeIn.hpp
          rdk/ds/sleepMode.hpp
          rdk/ds/pixelResolution.hpp
          rdk/ds/frontPanelConfig.hpp
          rdk/ds/frontPanelTextDisplay.hpp
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          rdk/iarmmgrs-hal/mfrMgr.h
          rdk/iarmmgrs-hal/sysMgr.h
          rdk/iarmmgrs-hal/pwrMgr.h
          audiocapturemgr/audiocapturemgr_iarm.h
          ccec/drivers/CecIARMBusMgr.h
          network/wifiSrvMgrIarmIf.h
          network/netsrvmgrIarm.h
          edid-parser.hpp
          libudev.h
          rfcapi.h
          rbus.h
          telemetry_busmessage_sender.h
          maintenanceMGR.h
          pkg.h
          secure_wrapper.h
          wpa_ctrl.h
          btmgr.h
          systemaudioplatform.h
          essos-resmgr.h
          drm.h
          drm_mode.h
          &&
          cp -r
          /usr/include/gstreamer-1.0/gst
          /usr/include/glib-2.0/*
          /usr/lib/x86_64-linux-gnu/glib-2.0/include/*
          /usr/local/include/trower-base64/base64.h
          /usr/include/libdrm/drm.h
          /usr/include/libdrm/drm_mode.h
          /usr/include/xf86drm.h
          . &&
          mkdir -p "$GITHUB_WORKSPACE/ci-ds"
          &&
          printf '%s\n'
          'set(DS_FOUND TRUE)'
          "set(DS_INCLUDE_DIRS \"$GITHUB_WORKSPACE/entservices-testframework/Tests/headers\")"
          'set(DS_LIBRARIES "")'
          > "$GITHUB_WORKSPACE/ci-ds/FindDS.cmake"
      - name: Set clang toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/clang.cmake" >> $GITHUB_ENV

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      # Build TestMocklib for L2 tests.
      # Protobuf + gRPC are installed above so the else(L2_TEST_OOP_RPC) branch
      # (TestMocklib) can compile. TestMocklib provides IarmBus::setImpl,
      # device::Host::setImpl, and all other setImpl symbols used by L2TestsMock.cpp.
      - name: Build mocks
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICE_L2_TEST
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I$GITHUB_WORKSPACE/entservices-helpers/helpers
          -I$GITHUB_WORKSPACE/install/usr/include
          -I$GITHUB_WORKSPACE/install/usr/include/WPEFramework"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      - name: Build entservices-helpers
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-helpers"
          -B build/entservices-helpers
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DPLUGIN_HELPERS=ON
          "-DCMAKE_CXX_FLAGS=
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h"
          &&
          cmake --build build/entservices-helpers
          &&
          cmake --install build/entservices-helpers

      # Build entservices-audiooutput with the L2 test shared library.
      # -DPLUGIN_L2Tests=ON    → builds Tests/L2Tests/CMakeLists.txt
      # -DRDK_SERVICE_L2_TEST=ON → activates L2 test code paths
      - name: Build entservices-audiooutput
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-audiooutput"
          -B build/entservices-audiooutput
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/ci-ds;$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DUSE_THUNDER_R4=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCOMCAST_CONFIG=OFF
          -DDS_FOUND=ON
          -DPLUGIN_AUDIOOUTPUT=ON
          -DPLUGIN_L2Tests=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/thunder
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/L2TestsPlugin
          -I$GITHUB_WORKSPACE/entservices-helpers/helpers
          -I$GITHUB_WORKSPACE/install/usr/include
          -I$GITHUB_WORKSPACE/build/mocks
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/HdmiCec.h
          -Wall -Wno-error=format -Wno-unused-result -Wno-deprecated-declarations
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog
          -DUSE_IARMBUS
          -DHAS_RBUS
          -DENABLE_TELEMETRY_LOGGING
          -DHAS_API_SYSTEM"
          &&
          cmake --build build/entservices-audiooutput -j8
          &&
          cmake --install build/entservices-audiooutput

      # Register AudioOutput L2 tests with L2TestsPlugin by appending a
      # target_link_libraries() entry to the upstream CMakeLists.
      # entservices-testframework 1.0.14 does not include PLUGIN_AUDIOOUTPUT in
      # its L2TestsPlugin link rules, so tests=0 without this patch.
      - name: Register AudioOutput L2 tests with L2TestsPlugin
        run: |
          FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/L2TestsPlugin/CMakeLists.txt
          echo 'if(PLUGIN_AUDIOOUTPUT)' >> "$FILE"
          echo '    target_link_libraries(${MODULE_NAME} PRIVATE ${CMAKE_INSTALL_PREFIX}/lib/libWPEFrameworkL2TestsAudioOutput.so)' >> "$FILE"
          echo 'endif()' >> "$FILE"
          echo "Patched L2TestsPlugin CMakeLists.txt"
          tail -6 "$FILE"

      # Build entservices-testframework (L2 runner: RdkServicesL2Test executable
      # + L2TestsPlugin). Must be built with the same plugin flags so the
      # L2TestsPlugin loads the AudioOutput L2 test shared library.
      - name: Build entservices-testframework
        run: |
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/entservices-testframework" \
            -B build/entservices-testframework \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/ci-ds;$GITHUB_WORKSPACE/install/tools/cmake" \
            -DHIDE_NON_EXTERNAL_SYMBOLS=OFF \
            -DCMAKE_CXX_FLAGS="\
            -DEXCEPTIONS_ENABLE=ON \
            -fprofile-arcs \
            -ftest-coverage \
            -DUSE_THUNDER_R4=ON \
            -DTHUNDER_VERSION=4 \
            -DTHUNDER_VERSION_MAJOR=4 \
            -DTHUNDER_VERSION_MINOR=4 \
            -DRDK_SERVICE_L2_TEST \
            -DDISABLE_SECURITY_TOKEN \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/audiocapturemgr \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/ccec/drivers \
            -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/network \
            -I$GITHUB_WORKSPACE/entservices-helpers/helpers \
            -I$GITHUB_WORKSPACE/install/usr/include \
            -I$GITHUB_WORKSPACE/build/mocks \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h \
            -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/rdk_logger_milestone.h \
            -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format= \
            -Wl,--no-as-needed \
            -DUSE_IARMBUS \
            -DHAS_RBUS \
            -DRDK_SERVICE_L2_TEST" \
            -DCOMCAST_CONFIG=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON \
            -DPLUGIN_AUDIOOUTPUT=ON \
            -DPLUGIN_L2Tests=ON \
            -DRDK_SERVICE_L2_TEST=ON \
            -DDS_FOUND=ON \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

          echo "===== L2 TESTFRAMEWORK DEBUG ====="

          echo "--- Required Protocol library ---"
          ls -l \
            "$GITHUB_WORKSPACE/install/usr/lib/libWPEFrameworkProtocols.so" \
            || true

          echo "--- Protocol references in generated testframework build ---"
          grep -RIn \
            "libWPEFrameworkProtocols.so\|WPEFrameworkProtocols" \
            "$GITHUB_WORKSPACE/build/entservices-testframework" \
            2>/dev/null | head -100 || true

          echo "--- Installed WPEFramework libraries ---"
          find "$GITHUB_WORKSPACE/install/usr/lib" \
            -maxdepth 1 \
            -name 'libWPEFramework*.so*' \
            -printf '%f\n' | sort || true

          cmake --build build/entservices-testframework -j8
          cmake --install build/entservices-testframework

      # ---- Minimal filesystem setup ----------------------------------------
      # AudioOutput plugin does not write to /opt or /lib/rdk at startup —
      # only needs Thunder config dirs and tmp dirs for PersistentStore paths.
      - name: Set up files
        run: >
          sudo mkdir -p -m 777
          /tmp/secure/persistent/rdkservicestore
          /tmp/persistent/rdkservicestore
          /opt/persistent
          /opt/logs
          &&
          sudo touch
          /etc/device.properties
          &&
          sudo chmod -R 777
          /etc/device.properties
          &&
          echo "BUILD_TYPE=VBN" | sudo tee /etc/device.properties

      # Remove the Platform precondition from AudioOutput.json so the plugin
      # can be activated without a Platform subsystem provider (e.g., PowerManager).
      # In a production system the precondition is satisfied by the PowerManager
      # plugin, but that plugin is not built/installed in this CI test environment.
      # Fix AudioOutput.json: remove Platform precondition (not satisfied in CI)
      # and correct classname from cmake PROJECT_NAME ("entservices-audiooutput")
      # to the actual C++ class name ("AudioOutput") registered by
      # SERVICE_REGISTRATION(AudioOutput, ...) in AudioOutput.cpp.
      # write_config() in ThunderTools defaults classname to ${PROJECT_NAME}
      # when no explicit CLASSNAME is given; the plugin CMakeLists.txt inherits
      # the top-level project name "entservices-audiooutput", so the generated
      # JSON has the wrong classname.
      - name: Remove Platform precondition from AudioOutput plugin config
        run: |
          find $GITHUB_WORKSPACE/install -name "AudioOutput.json" | while read F; do
            tmp=$(mktemp)
            jq 'del(.precondition) | .classname = "AudioOutput"' "$F" > "$tmp" && mv "$tmp" "$F"
            echo "Fixed classname and removed precondition from $F"
          done
          find $GITHUB_WORKSPACE/install -name "AudioOutput.json" -exec echo "=== {} ===" \; -exec cat {} \; || true

      # ---- Run tests -------------------------------------------------------

      - name: Run unit tests without valgrind
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      - name: Run unit tests with valgrind
        if: ${{ !env.ACT && inputs.caller_source != 'testframework' }}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          valgrind
          --tool=memcheck
          --log-file=valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      # ---- Coverage --------------------------------------------------------
      # Coverage tracked on build/entservices-audiooutput (plugin + L2 test lib).

      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT && inputs.caller_source != 'testframework' }}
        run: >
          cp $GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/.lcovrc_l2 ~/.lcovrc
          &&
          lcov -c
          -o coverage.info
          -d build/entservices-audiooutput
          &&
          lcov
          -r coverage.info
          '/usr/include/*'
          '*/build/entservices-audiooutput/_deps/*'
          '*/build/entservices-testframework/_deps/*'
          '*/install/usr/include/*'
          '*/Tests/headers/*'
          '*/Tests/mocks/*'
          '*/Tests/L2Tests/*'
          '*/googlemock/*'
          '*/googletest/*'
          -o filtered_coverage.info
          &&
          genhtml
          -o coverage
          -t "entservices-audiooutput L2 coverage"
          filtered_coverage.info

      # ---- Artifacts -------------------------------------------------------

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L2-audiooutput
          path: |
            coverage/
            valgrind_log
            rdkL2TestResultsWithoutValgrind.json
            rdkL2TestResultsWithValgrind.json
          if-no-files-found: warn
